services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: grounded
      POSTGRES_PASSWORD: grounded
      POSTGRES_DB: grounded
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "grounded", "-d", "grounded"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
